[project]
name = "pytweezer"
version = "0.2.1"
description = "Pytweezer package"
authors = [{ name = "Daniel Hoare", email = "d.hoare23@imperial.ac.uk" }]
requires-python = ">=3.11.4,<3.14"
readme = "README.md"
dependencies = [
    "pandas>=2.2.3,<3",
    "scipy>=1.17.1,<2",
    "matplotlib>=3.9.2,<4",
    "pylablib>=1.4.3,<2",
    "rich>=13.9.4,<14",
    "paramiko>=3.4.1,<4",
    "tifffile>=2026.1.28,<2027",
    "pillow>=12.1.0,<13",
    "pyzmq>=27.1.0,<28",
    "PyQt6>=6.9,<7",
    "PyQt6-Qt6>=6.9,<7",
    "ipykernel>=7.3,<8",
    "ipywidgets>=8.1.5,<9",
    "tqdm>=4.67.3,<5",
    "h5py>=3.15.1,<4",
    "cupy-cuda13x>=14.0.1,<15",
    "lap>=0.5.13,<0.6",
    "termcolor>=3.3.0,<4",
    "qscintilla>=2.14.1,<3",
    "pyperclip>=1.11.0,<2",
    "uncertainties>=3.2.3,<4",
    "imageio>=2.37.3,<3",
    "zmq>=0.0.0,<0.0.1",
    "pydantic>=2.10.5,<3",
    "psutil>=7.2,<8",
    "pyqtgraph>=0.14,<0.15",
    "pythonnet>=3.0.5,<4",
    "scikit-image>=0.26.0,<0.27",
    "pyvisa-py>=0.8.1,<0.9",
    "sipyco",
    "pycaf",
    "simple-pyspin>=0.1.1,<0.2",
    "easypyspin>=2.0.1,<3",
    "opencv-python>=4.13.0.92,<5",
    "pytest>=9.1.1,<10",
    "nidaqmx>=1.5.0,<2",
    "scikit-learn>=1.9.0,<2",
    "scikit-optimize>=0.10.2,<0.11",
    "pyserial>=3.5,<4",
    "pybase64>=1.4.3,<2",
    "ruff>=0.16.4,<0.17",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
pytweezer-server = "bin.launch:server_main"
pytweezer-client = "bin.launch:client_main"
pytweezer-device = "pytweezer.servers.device_server:main"
pytweezer-logger = "pytweezer.servers.logger_server:main"
pytweezer-experiment-manager = "pytweezer.servers.experiment_manager:main"
pytweezer-kill-stale = "bin.kill_stale:main"
pytweezer-db-backfill = "pytweezer.database.backfill:main"

[dependency-groups]
docs = [
    "sphinx",
    "furo",
    "myst-parser",
]

[tool.uv]
# uv only rebuilds the project (and so the C++ extensions in setup.py) when
# one of these changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "cpp_implementations/**/*.cpp" },
    { file = "cpp_implementations/**/*.h" },
]

[tool.uv.sources]
sipyco = { git = "https://github.com/m-labs/sipyco.git", rev = "ce454bb64257b1bcef3703f258aaf7fa4ee0c275" }
pycaf = { git = "https://github.com/ColdMatter/pycaf", branch = "cafmot" }

[tool.setuptools.packages.find]
include = ["pytweezer*", "bin*"]

[tool.setuptools.package-data]
"*" = ["*"]

[build-system]
requires = ["setuptools>=77", "pybind11>=2.10.0", "numpy"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# tests/ imports its own helpers as `tests.*`; the editable install only exposes
# pytweezer and bin.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
# Notebooks throughout the tree are exploratory scratch, not maintained code.
extend-exclude = [
	"**/archive/**",
	"**/*.ipynb",
	"pytweezer/drivers/Blink Plus/manual.md", # vendor manual, latin-1 encoded
]

[tool.ruff.lint]
# Ruff's default rule set is enforced, minus rules that fire pervasively for
# patterns that are deliberate here: broad `except Exception` in the pub/sub
# server loops, `a, _ = f()`-style throwaway unpacking, %-format strings, naive
# `datetime.now()`, and so on. Re-enable individually as the code is cleaned up.
ignore = [
	"BLE001", # blind-except (server loops intentionally catch broadly)
	"RUF059", # unused unpacked variable
	# "RUF013", # implicit Optional in annotations
	# "F841",   # unused local variable
	# "B006",  # mutable default argument
	# "B008",  # function call in default argument
	"UP031", # printf-style string formatting
	"E722",  # bare except
	"S110",  # try-except-pass
	"S112",  # try-except-continue
	# "SIM102",  # collapsible if
	"SIM105", # suppressible exception
	# "SIM118",  # key in dict.keys()
	"DTZ005", # datetime.now() without tz
	"DTZ011", # date.today()
	"LOG015", # logging call on root logger
	# "RUF046", # unnecessary int() cast
	# "PERF102", # incorrect dict iterator
	# "PLR1722", # sys.exit() alias
	# "PLW1510", # subprocess.run without check=
	"TRY201", # verbose raise
	"TRY002", # raise vanilla Exception
	"TRY003", # long message in raise
	# "C408",   # unnecessary dict()/list() call
	# "C409",   # unnecessary literal in tuple() call
	# "EXE001", # shebang, file not executable
	# "EXE002", # executable file, no shebang
	# "ISC003", # explicit string concatenation
	# "PIE810", # single startswith/endswith call
	# "RUF015", # unnecessary iterable allocation for first element
	"D419", # empty docstring
	"N999", # invalid module name
]

[tool.ruff.lint.per-file-ignores]
# tests/ holds the pytest suite and tools/ holds one-off benchmarks and scripts;
# exempt them from bare-assert / blind-raise-assert / "useless expression"
# (`1 / 0` raised on purpose) checks.
"tests/**" = ["S101", "S603", "S607", "B017", "B018"]
"tools/**" = ["S101", "S603", "S607", "B017", "B018", "F821"]
# Package __init__.py files are re-export hubs.
"__init__.py" = ["F401"]
